
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Gaming Hub</title>
<style>
* { box-sizing:border-box; }
body {
  margin:0;
  background:#080b14;
  color:white;
  font-family:Arial,sans-serif;
}
header {
  padding:25px 15px;
  text-align:center;
  background:linear-gradient(120deg,#b50020,#0754c9);
}
header h1 { margin:0; font-size:32px; }
header p { color:#ddd; }
.search {
  display:block;
  width:90%;
  margin:22px auto;
  padding:15px;
  border-radius:12px;
  border:1px solid #258aff;
  background:#151b2b;
  color:white;
  font-size:16px;
}
h2 { text-align:center; }
.grid {
  display:grid;
  grid-template-columns:repeat(2,1fr);
  gap:15px;
  padding:15px;
}
.card {
  background:#151b2b;
  border:1px solid #263c62;
  border-radius:15px;
  padding:22px 8px;
  text-align:center;
  box-shadow:0 0 12px #102b55;
}
.card a {
  color:white;
  text-decoration:none;
  display:block;
  font-size:19px;
  font-weight:bold;
}
.card span { font-size:35px; display:block; margin-bottom:12px; }
.card:active { transform:scale(.96); }
footer {
  text-align:center;
  padding:25px;
  color:#aaa;
}
</style>
</head>
<body>

<header>
<h1>🔥 GAMING HUB</h1>
<p>Games • Videos • Social • More</p>
</header>

<input class="search" id="search"
placeholder="🔎 Search games and apps..."
oninput="filterCards()">

<h2>🎮 Gaming & Social</h2>

<div class="grid" id="grid">

<div class="card"><a href="https://www.roblox.com"><span>🎮</span>Roblox</a></div>
<div class="card"><a href="https://www.fortnite.com"><span>🔫</span>Fortnite</a></div>
<div class="card"><a href="https://discord.com"><span>💬</span>Discord</a></div>
<div class="card"><a href="https://www.youtube.com"><span>▶️</span>YouTube</a></div>
<div class="card"><a href="https://www.tiktok.com"><span>🎵</span>TikTok</a></div>
<div class="card"><a href="https://www.twitch.tv"><span>🟣</span>Twitch</a></div>
<div class="card"><a href="https://www.minecraft.net"><span>⛏️</span>Minecraft</a></div>
<div class="card"><a href="https://www.rocketleague.com"><span>🚗</span>Rocket League</a></div>
<div class="card"><a href="https://www.instagram.com"><span>📸</span>Instagram</a></div>
<div class="card"><a href="https://www.x.com"><span>𝕏</span>X</a></div>

</div>

<footer>
<p>🔥 GAMING HUB</p>
<p>Made for gamers.</p>
</footer>

<script>
function filterCards() {
  const search = document.getElementById("search").value.toLowerCase();
  document.querySelectorAll(".card").forEach(card => {
    card.style.display =
      card.innerText.toLowerCase().includes(search) ? "" : "none";
  });
}
</script>

</body>
</html>
